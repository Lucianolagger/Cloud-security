name = "cloudflare-spyderbat-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# ── Cron: poll AI Gateway logs every 5 minutes ────────────────────────────
[triggers]
crons = ["*/5 * * * *"]

# ── Secrets (NEVER store values here — set via CLI) ───────────────────────
# Cloudflare → Spyderbat (ingest)
# wrangler secret put SPYDERBAT_API_URL
# wrangler secret put SPYDERBAT_API_TOKEN
# wrangler secret put SPYDERBAT_ORG_UID
# wrangler secret put AUTH_SECRET
#
# Spyderbat → Cloudflare (reverse block)
# wrangler secret put CF_API_TOKEN
# wrangler secret put CF_ACCOUNT_ID
# wrangler secret put CF_ZONE_ID
# wrangler secret put CF_IP_LIST_ID
# wrangler secret put SPYDERBAT_WEBHOOK_SECRET
#
# AI Gateway Shadow AI polling
# wrangler secret put CF_AI_GATEWAY_ID

# ── Governance KV namespace ───────────────────────────────────────────────
# Create it first: wrangler kv namespace create GOV_KV
# Then paste the id below
[[kv_namespaces]]
binding = "GOV_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"          # wrangler kv namespace create GOV_KV  → paste result.id here
preview_id = "REPLACE_WITH_YOUR_KV_PREVIEW_ID"   # same command shows preview_id for wrangler dev

# ── Secret: GOV_ADMIN_SECRET ──────────────────────────────────────────────
# wrangler secret put GOV_ADMIN_SECRET

# ── Route — update to your domain ─────────────────────────────────────────
# [[routes]]
# pattern = "security-ingest.yourdomain.com/*"
# zone_name = "yourdomain.com"
